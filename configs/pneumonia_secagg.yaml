# Secure aggregation between ten hospitals (PneumoniaMNIST): the server only
# learns the sum of the updates, even when some hospitals drop out mid-round.
name: pneumonia_secagg
output_dir: results
seeds: [0]

data:
  name: pneumoniamnist
  n_clients: 10
  partition: iid

fl:
  rounds: 20
  local_epochs: 1
  batch_size: 32
  lr: 0.05
  model: cnn

aggregator:
  threshold_frac: 0.5   # Shamir threshold t = floor(0.5 * n) + 1

secagg:
  dropout_rates: [0.0, 0.1, 0.3]
  benchmark_clients: [5, 10, 20]
