# Ten labs classify blood cells (BloodMNIST, 8 classes, Dirichlet alpha = 0.5).
# Two of them are malicious; every attack is tried against every aggregation rule.
name: bloodmnist_byzantine
output_dir: results
seeds: [0, 1]

data:
  name: bloodmnist
  n_clients: 10
  partition: dirichlet
  alpha: 0.5

fl:
  rounds: 20
  local_epochs: 1
  batch_size: 32
  lr: 0.05
  model: cnn

adversary:
  scale: 5.0          # sign_flip multiplier and backdoor boost (n_clients / n_malicious)
  noise_std: 0.1      # gaussian attack, per coordinate
  backdoor_target: 0  # basophil
  poison_fraction: 0.5
  trigger_size: 3

aggregator:
  trim_ratio: 0.2
  root_size: 100      # FLTrust: trusted samples held by the server (taken from the test set)

robustness:
  aggregators: [fedavg, median, trimmed_mean, krum, multi_krum, norm_clip, fltrust]
  attacks: [none, label_flip, sign_flip, gaussian, alie, backdoor]
  n_malicious: [2]
